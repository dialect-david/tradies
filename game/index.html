<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>tradies</title>
    <style>
      :root {
        --crt-scanline: 0.13;
        --crt-scanline-period: 3px;
        --crt-vignette: 0.4;
        --crt-vignette-start: 55%;
        --crt-bezel: 6px;
      }
      html,
      body {
        margin: 0;
        background: #1b1b1b;
        color: #eee;
        font:
          14px/1.4 ui-monospace,
          Menlo,
          monospace;
        overflow: hidden;
      }
      #game {
        position: absolute;
        inset: 0;
      }
      #game canvas {
        border-radius: var(--crt-bezel);
        box-shadow:
          0 0 0 3px #0a0a0a,
          0 0 0 5px #3a3a3a,
          0 0 40px 8px #000;
      }
      #crt {
        position: absolute;
        left: var(--crt-left, 0);
        top: var(--crt-top, 0);
        width: var(--crt-width, 100%);
        height: var(--crt-height, 100%);
        border-radius: var(--crt-bezel);
        pointer-events: none;
        background:
          radial-gradient(
            ellipse at center,
            transparent var(--crt-vignette-start),
            rgb(0 0 0 / var(--crt-vignette)) 100%
          ),
          repeating-linear-gradient(
            0deg,
            transparent 0 calc(var(--crt-scanline-period) - 1px),
            rgb(0 0 0 / var(--crt-scanline)) calc(var(--crt-scanline-period) - 1px) var(--crt-scanline-period)
          );
      }
      #hud {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 8px 12px;
        background: #000a;
        display: flex;
        gap: 16px;
        align-items: center;
      }
      #hud button {
        font: inherit;
        background: #333;
        color: #eee;
        border: 1px solid #555;
        padding: 4px 10px;
        cursor: pointer;
      }
      #card {
        position: absolute;
        top: 212px;
        left: var(--panel-left, 40px);
        width: var(--panel-width, 600px);
        box-sizing: border-box;
        max-height: calc(100vh - 270px);
        overflow: auto;
        background: #222;
        border: 2px solid #777;
        padding: 12px;
        display: none;
        font-size: 13px;
        line-height: 1.5;
        text-align: left;
      }
      #card.open {
        display: block;
      }
      body.board-open #card {
        left: 500px;
        width: calc(100vw - 540px);
      }
      #card h3 {
        margin: 0 0 6px;
        font-size: 15px;
      }
      #card input {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        background: #111;
        color: #eee;
        border: 1px solid #555;
        padding: 4px;
        margin: 6px 0;
      }
      #card .row {
        display: flex;
        gap: 8px;
      }
      #card button {
        font: inherit;
        background: #333;
        color: #eee;
        border: 1px solid #555;
        padding: 4px 10px;
        cursor: pointer;
      }
      #card button.primary {
        background: #f1c40f;
        color: #111;
        border-color: #f1c40f;
        font-weight: bold;
        padding: 6px 16px;
      }
      #card .hand-over {
        align-items: center;
        margin-top: 8px;
      }
      #card .by-hand,
      #board .by-hand {
        margin-top: 10px;
        color: #888;
        font-size: 11px;
      }
      #card .by-hand summary,
      #board .by-hand summary {
        cursor: pointer;
      }
      #card .by-hand[open],
      #board .by-hand[open] {
        color: #bbb;
      }
      #board {
        position: absolute;
        top: 212px;
        left: 40px;
        width: 440px;
        box-sizing: border-box;
        max-height: calc(100vh - 270px);
        overflow: auto;
        background: #3b2a1a;
        border: 6px solid #8b5a2b;
        padding: 10px;
        display: none;
        box-shadow: 0 8px 24px #0008;
      }
      #board.open {
        display: block;
      }
      #board .head {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      #board h3 {
        margin: 0;
        color: #f1c40f;
      }
      #board form.new[hidden] {
        display: none;
      }
      #board form.new {
        display: flex;
        gap: 6px;
        margin: 8px 0;
      }
      #board input,
      #board select {
        font: inherit;
        background: #fff8dc;
        color: #222;
        border: 1px solid #555;
        padding: 4px;
      }
      #board input {
        flex: 1;
      }
      #board input.filter {
        flex: 0 1 160px;
        background: #2a1d10;
        color: #eee;
        border-color: #8b5a2b;
      }
      #board button {
        font: inherit;
        background: #333;
        color: #eee;
        border: 1px solid #555;
        padding: 4px 10px;
        cursor: pointer;
      }
      #board .chits {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      #board .chit {
        position: relative;
        width: 100%;
        box-sizing: border-box;
        background: #fff8dc;
        color: #222;
        padding: 8px 8px 30px;
        box-shadow: 2px 2px 0 #0006;
        transform: rotate(-1deg);
        cursor: pointer;
        font-size: 12px;
      }
      #board .chit:nth-child(even) {
        transform: rotate(1.2deg);
        background: #fffacd;
      }
      #board .chit.p0 {
        background: #ffb3b3;
      }
      #board .chit.p1 {
        background: #ffd9a8;
      }
      #board .chit .title {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      #board .chit .trade {
        color: #666;
      }
      #board .chit .id {
        position: absolute;
        left: 8px;
        bottom: 8px;
        color: #777;
        font-size: 10px;
      }
      #board,
      #card {
        scrollbar-width: thin;
      }
      #board {
        scrollbar-color: #5c3f22 #3b2a1a;
      }
      #card {
        scrollbar-color: #444 #222;
      }
      #board.plans {
        width: calc(100vw - 80px);
        background: #1d2a3a;
        border-color: #4a6a8a;
      }
      #board.plans .graph svg {
        max-width: 100%;
        height: auto;
      }
      #board.plans g.node {
        cursor: pointer;
      }
      #card .crumb {
        font-size: 11px;
        color: #888;
        margin: -2px 0 6px;
      }
      #card .why { margin: 0 0 6px; }
      #card .why a { color: inherit; text-decoration: underline; }
      #card .why-working { color: #ff8c1a; }
      #card .why-asleep { color: #bdbdbd; }
      #card .why-needs { color: #ffd166; }
      #card .why-waiting { color: #c8963e; }
      #card .why-smoko { color: #cc3333; }
      #card .why-gone { color: #87ceeb; }
      #card .why-deferred { color: #f1e3c6; }
      #card .why-closed { color: #2e8b57; }
      #card .why-failing { color: #ff8080; }
      #card .why-approved { color: #a0ffa0; }
      #card .why-ready { color: #f1c40f; }
      #card .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin: 0 0 10px;
      }
      #card .chip {
        font: 11px ui-monospace, Menlo, monospace;
        padding: 1px 6px;
        border: 1px solid #555;
        color: #ccc;
        white-space: nowrap;
      }
      #card .chip.p0 { border-color: #e74c3c; color: #e74c3c; }
      #card .chip.p1 { border-color: #e67e22; color: #e67e22; }
      #card .chip.label { border-style: dashed; }
      #card .dim, #card .chip.dim { color: #777; border-color: #444; }
      #card .summary, #card .fold, #card .notes {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        max-width: 60ch;
        color: #ddd;
      }
      #card .summary { color: #eee; }
      #card p { margin: 0 0 8px; }
      #card ul, #card ol { margin: 0 0 8px; padding-left: 18px; }
      #card code, #card pre { font: 11px/1.5 ui-monospace, Menlo, monospace; color: #f1c40f; }
      #card pre { white-space: pre-wrap; color: #bbb; margin: 0 0 8px; }
      #card .fold { margin: 6px 0 0; color: #bbb; }
      #card .fold summary {
        cursor: pointer;
        color: #888;
        font: 11px ui-monospace, Menlo, monospace;
      }
      #card .fold[open] summary { color: #bbb; margin-bottom: 4px; }
      #card .rows a.r {
        display: flex;
        gap: 8px;
        align-items: baseline;
        padding: 2px 0;
        color: #7fb3ff;
        cursor: pointer;
      }
      #card .rows a.r.done { color: #777; text-decoration: line-through; }
      #card .rows a.r .dim { margin-left: auto; font-size: 11px; }
      #card .note { margin: 0 0 6px; }
      #card .note .dim { display: block; font-size: 11px; }
      #card a[data-open] { color: #7fb3ff; cursor: pointer; }
      #board.knockoff {
        width: 440px;
        background: #1c1a2e;
        border-color: #e07b39;
        color: #eee;
      }
      #board.knockoff h3 {
        color: #ffb347;
      }
      #board.knockoff h4 {
        margin: 12px 0 4px;
        color: #ffb347;
        font-size: 13px;
      }
      #board.knockoff .line {
        padding: 3px 0;
        cursor: pointer;
        font-size: 12px;
      }
      #board.knockoff .line:hover {
        color: #ffb347;
      }
      #board .chit .why {
        color: #555;
        font-size: 11px;
        margin-top: 2px;
      }
      #board.knockoff .why {
        color: #999;
        font-size: 11px;
        margin-left: 12px;
      }
      .copy {
        cursor: copy;
      }
      .copy:hover {
        color: #f1c40f;
      }
      #osd {
        display: none;
        position: absolute;
        right: 24px;
        top: 24px;
        width: 300px;
        padding: 10px 14px;
        background: #000d;
        color: #ffb000;
        border: 3px double #ffb000;
        font:
          13px/1.6 ui-monospace,
          Menlo,
          monospace;
        text-transform: uppercase;
        letter-spacing: 1px;
        image-rendering: pixelated;
        box-shadow: 0 0 12px #ffb00066;
      }
      #osd.open {
        display: block;
      }
      #osd h3 {
        margin: 0 0 8px;
        font-size: 13px;
        border-bottom: 1px solid #ffb00088;
      }
      #osd label {
        display: grid;
        grid-template-columns: 80px 1fr 48px;
        align-items: center;
        gap: 8px;
      }
      #osd label b {
        text-align: right;
        font-weight: normal;
      }
      #osd input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        height: 10px;
        background: repeating-linear-gradient(90deg, #ffb000 0 6px, #0000 6px 9px);
        border: 1px solid #ffb000;
        cursor: pointer;
      }
      #osd input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 18px;
        background: #ffb000;
        border: 2px solid #000;
      }
      #osd .row {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 8px;
      }
      #osd button {
        font: inherit;
        text-transform: inherit;
        background: #000;
        color: #ffb000;
        border: 2px solid #ffb000;
        padding: 2px 10px;
        cursor: pointer;
      }
      #osd button:hover {
        background: #ffb000;
        color: #000;
      }
      #toast {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        background: #000c;
        padding: 6px 14px;
        border-radius: 4px;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
      }
      #toast.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="crt"></div>
    <div id="osd"></div>
    <div id="card"></div>
    <div id="board"></div>
    <div id="toast"></div>
    <div id="hud"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
