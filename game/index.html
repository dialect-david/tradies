<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>tradies</title>
    <style>
      html,
      body {
        margin: 0;
        background: #1b1b1b;
        color: #eee;
        font:
          14px/1.4 ui-monospace,
          Menlo,
          monospace;
        overflow: hidden;
      }
      #game {
        position: absolute;
        inset: 0;
      }
      #hud {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 8px 12px;
        background: #000a;
        display: flex;
        gap: 16px;
        align-items: center;
      }
      #hud button {
        font: inherit;
        background: #333;
        color: #eee;
        border: 1px solid #555;
        padding: 4px 10px;
        cursor: pointer;
      }
      #card {
        position: absolute;
        top: 40px;
        right: 40px;
        width: 420px;
        background: #222;
        border: 2px solid #777;
        padding: 12px;
        display: none;
      }
      #card.open {
        display: block;
      }
      #card h3 {
        margin: 0 0 6px;
        font-size: 15px;
      }
      #card pre {
        white-space: pre-wrap;
        max-height: 50vh;
        overflow: auto;
        font-size: 12px;
        color: #bbb;
      }
      #card input {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        background: #111;
        color: #eee;
        border: 1px solid #555;
        padding: 4px;
        margin: 6px 0;
      }
      #card .row {
        display: flex;
        gap: 8px;
      }
      #card button {
        font: inherit;
        background: #333;
        color: #eee;
        border: 1px solid #555;
        padding: 4px 10px;
        cursor: pointer;
      }
      #board {
        position: absolute;
        top: 30px;
        left: 30px;
        width: 520px;
        max-height: 80vh;
        overflow: auto;
        background: #3b2a1a;
        border: 6px solid #8b5a2b;
        padding: 10px;
        display: none;
        box-shadow: 0 8px 24px #0008;
      }
      #board.open {
        display: block;
      }
      #board .head {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      #board h3 {
        margin: 0;
        color: #f1c40f;
      }
      #board form.new {
        display: flex;
        gap: 6px;
        margin: 8px 0;
      }
      #board input,
      #board select {
        font: inherit;
        background: #fff8dc;
        color: #222;
        border: 1px solid #555;
        padding: 4px;
      }
      #board input {
        flex: 1;
      }
      #board button {
        font: inherit;
        background: #333;
        color: #eee;
        border: 1px solid #555;
        padding: 4px 10px;
        cursor: pointer;
      }
      #board .chits {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      #board .chit {
        position: relative;
        width: 236px;
        background: #fff8dc;
        color: #222;
        padding: 8px 8px 30px;
        box-shadow: 2px 2px 0 #0006;
        transform: rotate(-1deg);
        cursor: pointer;
        font-size: 12px;
      }
      #board .chit:nth-child(even) {
        transform: rotate(1.2deg);
        background: #fffacd;
      }
      #board .chit.p0 {
        background: #ffb3b3;
      }
      #board .chit.p1 {
        background: #ffd9a8;
      }
      #board .chit .title {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      #board .chit .trade {
        color: #666;
      }
      #board .chit .id {
        position: absolute;
        left: 8px;
        bottom: 8px;
        color: #777;
        font-size: 10px;
      }
      #board .chit button {
        position: absolute;
        right: 6px;
        bottom: 6px;
        padding: 2px 8px;
      }
      #toast {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        background: #000c;
        padding: 6px 14px;
        border-radius: 4px;
        opacity: 0;
        transition: opacity 0.3s;
      }
      #toast.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="card"></div>
    <div id="board"></div>
    <div id="toast"></div>
    <div id="hud"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
